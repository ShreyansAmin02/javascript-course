<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7g</title>
</head>

<body>
  <h1>7g</h1>
  <script>
    function convertLength(length, from, to) {
      if (from === 'miles' && to == 'km') {
        return length * 1.60934;
      }
      else if (from === 'km' && to == 'miles') {
        return length / 1.60934;
      }
      else if (from === 'miles' && to == 'feet') {
        return length * 5280;
      }

      else if (from === 'feet' && to == 'miles') {
        return length / 5280;
      }
      else if (from === 'feet' && to == 'km') {
        return length / 3280.84;
      }
      else if (from === 'km' && to == 'feet') {
        return length * 3280.84;
      }
      else {
        if (!['miles', 'km', 'feet'].includes(from)) {
          return `Invalid unit: ${from}`;
        }
        if (!['miles', 'km', 'feet'].includes(to)) {
          return `Invalid unit: ${to}`;
        }
      }
    }


    console.log(convertLength(5, 'km', 'lbs'));
  </script>
</body>

</html>
