<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
</head>

<body>
  <header>
    <h1>Calculator Local Storage Version</h1>
  </header>
  <main>
    <p>
      <button onclick="
      calc('1');
      ">1</button>
      <button onclick="
      calc('2');
      ">2</button>
      <button onclick="
      calc('3');
      ">3</button>
      <button onclick="
      calc('+');
      ">+</button>

    </p>
    <p>
      <button onclick="
      calc('4');
      ">4</button>
      <button onclick="
      calc('5');
      ">5</button>
      <button onclick="
      calc('6');
      ">6</button>

      <button onclick="
      calc('-');
      ">-</button>
    </p>
    <p>
      <button onclick="
      calc('7');
      ">7</button>
      <button onclick="
      calc('8');
      ">8</button>
      <button onclick="
      calc('9');
      ">9</button>
      <button onclick="
      calc('*');
      ">*</button>
    </p>
    <p>
      <button onclick="
      calc('0');
      ">0</button>
      <button onclick="
      calc('.');
      ">.</button>

      <button onclick="
      evaluation = eval(calculation);
      console.log(evaluation);
      calculation = '';
      ">=</button>

      <button onclick="
      calc('/');
      ">/</button>
    </p>
    <p>
      <button onclick="
      calculation = '';
      console.log('Cleared');
      ">Clear</button>
    </p>
  </main>

  <script>
    let calculation = localStorage.getItem('calculation') || '';
    console.log(calculation);
    function calc(input) {
      calculation += input;
      console.log(calculation);
      localStorage.setItem('calculation', calculation);
    }

  </script>
</body>

</html>
