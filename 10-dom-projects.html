<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10-DOM</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      padding-bottom: 110px;
      padding: 10px;
      background-color: #f4f4f4;
    }

    .subscribe-button {
      background-color: red;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 10px 10px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 30px;
    }

    .is-subscribed {
      background-color: rgb(240, 240, 240);
      border: 1px solid black;
      color: #000;
    }

    .cost-input {
      border-radius: 5px;
      border: 1px solid #ccc;
      padding: 10px;
    }

    .calc-button {
      background-color: green;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
    }

    .calc-button:hover {
      background-color: darkgreen;
    }

    .calc-button:active {
      background-color: rgb(28, 172, 28);
    }
  </style>
</head>

<body>
  <h1>10-DOM Projects</h1>
  <p>YouTube Subscribe Button</p>
  <button class="subscribe-button" onclick="
    subscribe();
  ">Subscribe</button>

  <p>Amazon Shopping Calculator</p>
  <p>Orders under $40 = +$10 Shipping</p>
  <p>Orders over $40 = FREE Shipping</p>
  <input class="js-cost-input cost-input" placeholder="Cost of Order" onkeydown="
    handleKeyDown(event);
    ">
  <button class="calc-button" onclick="
    calculateTotal();
  ">Calcualte</button>
  <p class="js-total-price"></p>

  <script>

    function subscribe() {
      const subButton = document.querySelector('.subscribe-button');
      if (subButton.innerHTML === 'Subscribed') {
        subButton.innerHTML = 'Subscribe';
        subButton.classList.remove('is-subscribed');
      }
      else {
        subButton.innerHTML = 'Subscribed';
        subButton.classList.add('is-subscribed');
      }
    }

    function handleKeyDown(event) {
      if (event.key === 'Enter') {
        calculateTotal();
      }
    }

    function calculateTotal() {
      const input = document.querySelector('.js-cost-input');
      let total = document.querySelector('.js-total-price');
      let cost = Number(input.value);

      if (isNaN(cost)) {
        total.innerHTML = 'Please enter a valid number';
        return;
      }

      if (cost < 40) {
        cost = cost + 10;
        total.innerHTML = `Total Cost: $${cost}`;
      } else {
        total.innerHTML = `Total Cost: $${cost}`;
      }
    }

  </script>
</body>

</html>
