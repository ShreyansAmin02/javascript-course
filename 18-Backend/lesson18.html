<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>18-Backend Exercises</title>
</head>

<body>
  <h1>18-Backend Exercises</h1>
  <script>
    function a() {
      const xhr = new XMLHttpRequest();
      xhr.addEventListener('load', () => {
        console.log(`Response: ${xhr.response}`);
      });
      xhr.open('GET', 'https://supersimplebackend.dev/greeting')
      xhr.send();
    }
    a();

    async function b() {
      const response = await fetch('https://supersimplebackend.dev/greeting'); // await to fetch return a promise
      const data = await response.text(); // await a response 
      console.log(`Response: ${data}`); // log the data
    }
    b();

    async function d() {
      const response = await fetch('https://supersimplebackend.dev/greeting', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          name: 'Shreyans'
        })
      })
      const data = await response.text();
      console.log(`Response: ${data}`);
    }
    d();

    async function e() {
      try {
        const response = await fetch('https://amazon.com');
        const data = await response.text();
        console.log(`Response: ${data}`);
      } catch (error) {
        console.error(`CORS Error: Your request was blocked by the backend`);
      }
    }
    e();

    async function f() {
      try {
        const response = await fetch('https://supersimplebackend.dev/greeting', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          }
        }); if (response.status >= 400) {
          throw response;
        }

        const text = await response.text();
        console.log(text);

      } catch (error) {
        if (error.status === 400) {
          const errorMessage = await error.json();
          console.log(errorMessage);
        } else {
          console.log('Network error. Please try again later.');
        }
      }
    }
    f();
  </script>
</body>

</html>
