<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11j</title>
</head>

<body>
  <h1>11j</h1>
  <script>
    function addArrays(array1, array2) {
      let array3 = [];
      for (i = 0; i < array1.length; i++) {
        array3[i] = array1[i] + array2[i];
      }
      return array3
    }

    const array1 = [1, 1, 2];
    const array2 = [1, 1, 3];

    console.log(addArrays(array1, array2));

    console.log('11k: ')

    function countPositives(array) {
      let positives = 0;
      for (i = 0; i < array.length; i++) {
        const value = array[i];
        if (value > 0) {
          positives++;
        }
      }
      return positives;
    }
    console.log(countPositives([1, -3, 5, 6, 0])); // Expected output: 3 because there are three positive numbers (1, 5, 6).
    console.log(countPositives([-1, -2, -3, -4])); // Expected output: 0 because there are no positive numbers.
    console.log(countPositives([0, 0, 0, 0, 1])); // Expected output: 1 because there is one positive number (1).

    console.log(countPositives([1, -3, 5]));

  </script>
</body>

</html>
