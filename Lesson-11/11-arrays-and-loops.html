    const array1 = [1, 2, 3];

    for (let i = 1; i <= 10; i++) {
      if (i % 3 === 0) {
        continue; // skips the number 3
      }
      console.log(i);
      if (i === 8) {
        break; // stops the loop early at 8
      }
    }
    console.log('for is over');

    let i = 1;

    while (i <= 10) {
      if (i % 3 === 0) {
        i++; // skips anything that is divisible by 3 (i % 3 === 0 means that there will be no remainders when devided by 3)
        continue;
      }
      console.log(i);
      i++;
    }

    function doubleArray(nums) {
      const numsDoubled = [];
      for (let i = 0; i < nums.length; i++) {
        const num = nums[i];
        if (num === 0) {
          break;
        }
        numsDoubled.push(nums[i] * 2);
      }
      console.log(numsDoubled);
    }

    doubleArray([1, 2, 3, 4, 5]);
    doubleArray([6, 7, 8, 9, 10]);
    doubleArray([1, 2, 0, 4]);
