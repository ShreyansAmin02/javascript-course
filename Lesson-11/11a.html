<body>
  <h1>11a</h1>
  <script>
    const nums = [10, 20, 30];
    console.log(nums);


    function getLastArray(array) {
      const i = array.length - 1;
      const value = array[i];
      console.log(value);
    }

    getLastArray(nums);

    function arraySwap(array) {
      const firtValue = array[0];
      const i = array.length - 1;
      const lastValue = array[i];
      array[0] = lastValue;
      array[i] = firtValue;
      console.log(array);
    }

    arraySwap(nums);

  </script>
