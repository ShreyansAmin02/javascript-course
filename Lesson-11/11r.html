<body>
  <h1>11r</h1>
  <p>
    Create a function removeEgg(foods) that takes an array of strings and rteturns an array where teh string 'egg' is
    removed.
  </p>
  <script>
    function removeEgg(foods) {
      let newFoods = [];
      for (let i = 0; i < foods.length; i++) {
        if (foods[i] === 'egg') {
          continue;
        }
        newFoods.push(foods[i]);
      }
      console.log(newFoods);
    }

    // Example 1
    removeEgg(['egg', 'bacon', 'sausage', 'egg', 'toast']);
    // Example 2
    removeEgg(['egg', 'egg', 'egg', 'egg']);
    // Example 3
    removeEgg(['pancake', 'waffle', 'egg', 'juice']);
  </script>
</body>
