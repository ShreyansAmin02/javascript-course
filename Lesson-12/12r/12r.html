<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="styles/12r.css">

</head>

<body>
  <h1>Rock Paper Scissors Game: Final</h1>
  <!-- Buttons for player to choose their move -->
  <button class="move-button js-rock-button">
    <img src="img/rock-emoji.png" class="move-icon">
  </button>
  <button class="move-button js-paper-button">
    <img src="img/paper-emoji.png" class="move-icon">
  </button>
  <button class="move-button js-scissors-button">
    <img src="img/scissors-emoji.png" class="move-icon">
  </button>
  <p class="js-result">Result: </p>
  <p class="js-moves">Moves: </p>
  <p class="js-score"></p>
  <button class="reset-btn">Reset Score</button>
  <button class="auto-play-btn">Auto Play</button>
  <p class="js-confirm"></p>

  <script src="scripts/12r.js">
  </script>
</body>

</html>
