<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12m</title>
</head>

<body>
  <h1>Welcome to 12m</h1>
  <p>Create a function addNum(array, num) that takes an array of numbers and returns an array where each number is
    increased by 'num'. Create this fucntion using .map() instead of a loop</p>
  <script>
    // Your JavaScript code goes here
    function addNum(array, num) {
      console.log(array.map(value => value + num));
    };

    addNum([1, 2, 3], 2);
    addNum([-2, -1, 0, 99], 2);
  </script>

</body>

</html>
