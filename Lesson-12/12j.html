<!DOCTYPE html>
<html lang="en">

<body>
  <h1>12j</h1>
  <p>Create an arrow function called 'multiply' that takes 2 numbers, multiplies them together, and returns the result
  </p>
  <ul>
    <li>multiply(2,3) => 6</li>
    <li>multiply(7,10) => 70</li>
  </ul>
  <script>
    const multiply = (a, b) => {
      return a * b;
    };

    console.log(multiply(2, 3));
    console.log(multiply(7, 10));

  </script>
</body>
