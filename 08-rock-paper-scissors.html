<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
</head>

<body>
  <h1>Rock Paper Scissors Game V2</h1>
  <p>Rock Paper Scissors:</p>
  <!-- Buttons for player to choose their move -->
  <button onclick="playGame('Rock');">Rock</button>
  <button onclick="playGame('Paper');">Paper</button>
  <button onclick="playGame('Scissors');">Scissors</button>
  <button onclick="
    score.wins = 0;
    score.losses = 0;
    score.ties = 0;
    localStorage.removeItem('Score');
    alert('Score has been reset!');
  ">Reset Score</button>

  <script>
    // Object to store the score
    let score = JSON.parse(localStorage.getItem('Score')) || {
      wins: 0,
      losses: 0,
      ties: 0
    }
      ; // Get the score from local storage
    console.log(localStorage.getItem('Score'));

    // Function to play the game
    function playGame(playerMove) {
      const computerMove = pickComputerMove(); // Get computer's move

      // Determine the result based on player's move and computer's move
      if (playerMove == "Scissors") {
        if (computerMove === 'Rock') {
          result = 'You lose!';
        } else if (computerMove === 'Paper') {
          result = 'You win!';
        } else {
          result = 'Tie!';
        }
      }
      else if (playerMove == "Paper") {
        if (computerMove === 'Rock') {
          result = 'You win!';
        } else if (computerMove === 'Paper') {
          result = 'Tie!';
        } else {
          result = 'You lose!';
        }
      }
      else if (playerMove == "Rock") {
        if (computerMove === 'Rock') {
          result = 'Tie!';
        } else if (computerMove === 'Paper') {
          result = 'You lose!';
        } else {
          result = 'You win!';
        }
      }

      // Update the score
      if (result === 'You win!') {
        score.wins++;
      } else if (result === 'You lose!') {
        score.losses++;
      } else {
        score.ties++;
      }

      localStorage.setItem('Score', JSON.stringify(score)); // Save the score to local storage


      // Display the result
      alert(`You picked ${playerMove}. The computer picked ${computerMove}. ${result}
Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
    }


    // Function to randomly pick the computer's move
    function pickComputerMove() {
      const randomNumber = Math.random(); // Generate a random number between 0 and 1
      let computerMove = '';

      // Assign a move based on the random number
      if (randomNumber >= 0 && randomNumber < 1 / 3) {
        computerMove = 'Rock';
      } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
        computerMove = 'Paper';
      } else {
        computerMove = 'Scissors';
      }
      console.log(computerMove); // Log the computer's move to the console
      return computerMove; // Return the computer's move
    }
  </script>
</body>

</html>
