<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9h</title>
</head>

<body>
  <h1>9h</h1>
  <input class="js-input" onkeydown="
    handleKeyDown(event);">
  <p class="js-output"></p>
  <script>
    // Your JavaScript code will go here
    function handleKeyDown() {
      const input = document.querySelector('.js-input');
      document.querySelector('.js-output').innerHTML = input.value;
    }
  </script>
</body>
