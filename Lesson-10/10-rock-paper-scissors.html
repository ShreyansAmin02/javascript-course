<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="styles/10-rock-paper-scissors.css">

</head>

<body>
  <h1>Rock Paper Scissors Game: Final</h1>
  <!-- Buttons for player to choose their move -->
  <button onclick="playGame('Rock');" class="move-button">
    <img src="images/rock-emoji.png" class="move-icon">
  </button>
  <button onclick="playGame('Paper');" class="move-button">
    <img src="images/paper-emoji.png" class="move-icon">
  </button>
  <button onclick="playGame('Scissors');" class="move-button">
    <img src="images/scissors-emoji.png" class="move-icon">
  </button>
  <p class="js-result">Result: </p>
  <p class="js-moves">Moves: </p>
  <p class="js-score"></p>
  <button class="reset-btn" onclick="
    resetScore();
  ">Reset Score</button>

  <script src="scripts/10-rock-paper-scissors.js">
  </script>
</body>

</html>
