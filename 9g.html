<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>09-Document Object Model</title>
</head>

<body>
  <h1>9G</h1>

  <p>Amazon Shopping Calculator</p>
  <p>Orders under $40 = +$10 Shipping</p>
  <p>Orders over $40 = FREE Shipping</p>
  <input class="js-cost-input" placeholder="Cost of Order" onkeydown="
    handleKeyDown(event);
    ">
  <button onclick="
    calculateTotal();
  ">Calculate</button>
  <p class="js-total-price"></p>

  <script>
    function handleKeyDown(event) {
      if (event.key === 'Enter') {
        calculateTotal();
      }
    }

    function calculateTotal() {
      const input = document.querySelector('.js-cost-input');
      let total = document.querySelector('.js-total-price');
      let cost = Number(input.value);

      if (isNaN(cost)) {
        total.innerHTML = 'Please enter a valid number';
        return;
      }

      if (cost < 40) {
        cost = Math.round((cost + 10) * 100);
        total.innerHTML = `Total Cost: $${(cost / 100).toFixed(2)}`;
      } else {
        total.innerHTML = `Total Cost: $${cost}`;
      }
    }
  </script>
</body>

</html>
